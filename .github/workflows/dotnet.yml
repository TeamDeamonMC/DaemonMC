name: .NET

on:
  push:
    branches: [ "release" ]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Extract version from .csproj
      run: |
        version=$(grep -oPm1 "(?<=<Version>)[^<]+" DaemonMC/DaemonMC.csproj)
        echo "VERSION=$version" >> "$GITHUB_ENV"
        
    - name: Create Git Tag
      run: |
        VERSION=${{ env.VERSION }}
        git tag $VERSION
        git push origin $VERSION
        
    - name: Read releasenotes
      run: |
        head -n 10 releasenotes.txt > release_body.md
        cat release_body.md
        
    - name: Restore dependencies
      working-directory: DaemonMC
      run: dotnet restore

    - name: Build
      working-directory: DaemonMC
      run: dotnet build --no-restore
      
    - name: Publish Application
      working-directory: DaemonMC
      run: |
        dotnet publish -c Release -r win-x64 -o publish/win-x64
        dotnet publish -c Release -r linux-x64 -o publish/linux-x64
        ls -la publish/win-x64 publish/linux-x64
        test -f publish/win-x64/DaemonMC.exe
        test -f publish/linux-x64/DaemonMC
        test "$(ls publish/win-x64 | wc -l)" -eq 1
        test "$(ls publish/linux-x64 | wc -l)" -eq 1

    - name: Publish NuGet Package
      working-directory: DaemonMC
      run: |
        dotnet nuget push bin/Release/*.nupkg \
        --api-key ${{ secrets.nugetkey }} \
        --source https://api.nuget.org/v3/index.json \
        --skip-duplicate
      
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.VERSION }}
        target_commitish: ${{ github.sha }}
        name: "DaemonMC ${{ env.VERSION }}"
        body_path: release_body.md
        files: |
          DaemonMC/publish/win-x64/DaemonMC.exe
          DaemonMC/publish/linux-x64/DaemonMC
      env:
        GITHUB_TOKEN: ${{ secrets.actionpat }}

    - name: Discord
      env:
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        RELEASE_URL: ${{ steps.release.outputs.url }}
        FALLBACK_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.VERSION }}
      run: |
        url="${RELEASE_URL:-$FALLBACK_URL}"
        jq -n \
          --arg title "New release: DaemonMC $VERSION" \
          --arg url "$url" \
          --rawfile notes release_body.md \
          '{
            username: "DaemonMC",
            embeds: [{
              title: $title,
              url: $url,
              description: (if ($notes | length) == 0 then "No release notes." else ($notes | .[0:4000]) end)
            }]
          }' > discord.json
        curl -fsS -X POST -H "Content-Type: application/json" \
          --data @discord.json "$WEBHOOK_URL"